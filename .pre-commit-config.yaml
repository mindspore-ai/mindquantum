# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://github.com/pre-commit/pre-commit

---

ci:
  skip: [check-manifest, cppcheck]

repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^(.*patch[0-9]*)$
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ^(.*patch[0-9]*)$

  # Changes tabs to spaces
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-tabs
        exclude: ^(.*Makefile|.*patch[0-9]*)$

  - repo: https://github.com/PyCQA/doc8/
    rev: v1.1.2
    hooks:
      - id: doc8
        alias: doc8-lint
        require_serial: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        require_serial: false
        args: [-x, --severity=warning]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        require_serial: false
        files: .*\.(py|txt|cmake|md|rst|sh|ps1|hpp|tpp|cpp|cc)$
        args: [-S, '.git,third_party', -I, .codespell.allow]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        require_serial: false

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        require_serial: false
        additional_dependencies: [pyyaml]

  - repo: local
    hooks:
      - id: cmakelint-ci
        name: cmakelint (CI parity)
        entry: cmakelint
        language: python
        types: [cmake]
        require_serial: false
        additional_dependencies: [cmakelint==1.4.1]
        args: [--config=None, --spaces=2, --linelength=120]

  # ---- Python: ruff replaces black, flake8, isort, pyupgrade, pydocstyle ----

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        args: [-l, '120']
        additional_dependencies: [black]

  # ---- C++ tooling ----

  - repo: https://github.com/Takishima/cmake-pre-commit-hooks/
    rev: v1.9.6
    hooks:
      - id: cpplint
        require_serial: false
        args: [--quiet]
        files: .*\.(h|hpp|tpp|cpp|cc)$
        additional_dependencies: ['cpplint']
      - id: lizard
        require_serial: false
        files: .*\.(h|hpp|tpp|cpp|cc|py)$
        args: [--languages=cpp, --languages=python, --languages=java,
               -C19, -L100,
               --exclude=*/tests/*, --exclude=*/test/*, --exclude=*/third_party/*,
               -W.whitelizard.txt, -w, --no-cmake-configure]
        additional_dependencies: ['lizard']

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.1
    hooks:
      - id: clang-format
        args: ["-i", "--style=file"]
        files: .*\.(h|hpp|tpp|cpp|cc)$

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: cppcheck
        files: .*\.(h|hpp|tpp|cpp|cc)$
        args: [--force,
               --enable=all,
               --error-exitcode=1,
               --inline-suppr,
               --std=c++20,
               --language=c++,
               --suppressions-list=.cppcheck.suppressions]
